<!DOCTYPE html>
<html lang="{{ site.lang | default: "en-US" }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ page.title }}</title>
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
    <style>
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #f5f5f5;
        margin: 0;
        padding: 0;
      }
      .wrapper {
        max-width: 1000px;
        margin: 0 auto;
        background-color: white;
        min-height: 100vh;
      }
      header {
        background-color: #003366;
        color: white;
        padding: 2rem;
        display: none;
      }
      section {
        padding: 2rem;
      }
      .page-header {
        background: linear-gradient(135deg, #003366 0%, #004d99 100%);
        color: white;
        padding: 3rem 2rem;
        margin: -2rem -2rem 2rem -2rem;
        text-align: center;
      }
      .page-header h1 {
        margin: 0;
        font-size: 2.5rem;
        font-weight: 300;
      }
      .page-header p {
        margin: 0.5rem 0 0 0;
        font-size: 1.1rem;
        opacity: 0.95;
      }
      .content-section {
        background: white;
        padding: 2rem;
        margin: 2rem 0;
        border: 1px solid #e0e0e0;
        border-radius: 4px;
      }
      .highlight-box {
        background: transparent;
        border-left: 5px solid #cc0000;
        padding: 0.25rem 0;
        margin: 1rem 0;
      }
      .highlighted-text {
        color: #ff0000;
        font-weight: bold;
        font-size: 1.1rem;
      }
      .section-title {
        font-size: 1.5rem;
        color: #003366;
        margin-top: 2rem;
        margin-bottom: 1rem;
        border-bottom: 2px solid #003366;
        padding-bottom: 0.5rem;
      }
      .entry {
        border-bottom: 1px solid #e6e6e6;
        padding: 0.75rem 0;
      }
      .street {
        font-weight: 700;
        margin: 0 0 0.25rem 0;
        color: #000;
      }
      ul.bullet-red {
        margin: 0.25rem 0 0 1.1rem;
        padding: 0;
      }
      ul.bullet-red li {
        margin: 0.125rem 0;
      }
      ul.bullet-red li::marker {
        color: #cc0000;
        font-size: 1.1em;
      }
      /* Ensure bullets are shown and link-like list items appear blue */
      ul.bullet-red {
        list-style: disc;
      }
      ul.bullet-red li.link-like {
        color: #0056b3;
        text-decoration: underline;
      }
      .info-box {
        background: #e8f4f8;
        border-left: 4px solid #0066cc;
        padding: 1.5rem;
        margin: 1rem 0;
      }
      .info-box p {
        margin: 0.5rem 0;
        line-height: 1.6;
      }
      footer {
        background-color: #f0f0f0;
        padding: 1rem 2rem;
        text-align: center;
        border-top: 1px solid #ddd;
        color: #666;
        display: none;
      }
      @media (max-width: 768px) {
        .page-header h1 {
          font-size: 1.8rem;
        }
        .highlight-box {
          padding: 0.25rem 0;
          margin: 0.5rem 0;
        }
        section {
          padding: 1rem;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrapper">
      <div class="page-header">
        <h1>{{ page.title }}</h1>
        {% if page.subtitle %}
        <p>{{ page.subtitle }}</p>
        {% endif %}
      </div>
      
      <section>
        {{ content }}
      </section>

      <footer>
        <p><small>Mieterversammlung Information</small></p>
      </footer>
    </div>
  </body>
</html>
